# Render blueprint — static Jamstack LMS only.

services:
  - type: web
    name: aiclintrack-lms-web
    runtime: docker
    rootDir: web
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: VITE_CTMS_ORIGIN
        sync: false
      - key: VITE_ADMIN_KEY
        sync: false
      - key: VITE_PROGRESS_API_URL
        sync: false
