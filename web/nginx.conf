server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/assets/.+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Same-origin proxy for the AIClinTrack YouTube RSS feed.
    location = /youtube/feed {
        resolver 1.1.1.1 ipv6=off valid=300s;
        proxy_pass https://www.youtube.com/feeds/videos.xml?channel_id=UCRxbK63ZwgkspA_afRlpxqA;
        proxy_ssl_server_name on;
        proxy_set_header Host www.youtube.com;
        proxy_set_header User-Agent "AiClinTrack-LMS";
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
